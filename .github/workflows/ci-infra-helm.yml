name: infra-helm-ci

on:
  push:
    paths:
      - "helm/**"
      - ".github/workflows/ci-infra-helm-ci.yml"
  pull_request:
    paths:
      - "helm/**"

permissions:
  contents: read
  id-token: write
  packages: write
  security-events: write

jobs:

  helm-yamllint-lint:
    name: Code Quality (Yamllint + Helm Lint + Helmfile Lint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip curl wget
          pip install yamllint
          curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          wget https://github.com/roboll/helmfile/releases/download/v0.144.0/helmfile_linux_amd64
          chmod +x helmfile_linux_amd64
          sudo mv helmfile_linux_amd64 /usr/local/bin/helmfile

      - name: Run Yamllint
        run: yamllint helm/

      - name: Run Helm Lint
        run: helm lint helm/*

      - name: Run Helmfile Lint
        run: helmfile lint

  gitleaks-secrets:
    name: Secrets Check (Gitleaks)
    runs-on: ubuntu-latest
    needs: helm-yamllint-lint
    steps:
      - uses: actions/checkout@v3

      - name: Install Gitleaks
        run: |
          curl -sSfL https://raw.githubusercontent.com/zricethezav/gitleaks/main/install.sh | bash

      - name: Run Gitleaks
        run: gitleaks detect --source=helm/ --verbose

  trivy-fs:
    name: Repo Security (Trivy FS)
    runs-on: ubuntu-latest
    needs: gitleaks-secrets
    steps:
      - uses: actions/checkout@v3

      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget
          wget https://github.com/aquasecurity/trivy/releases/latest/download/trivy_0.46.0_Linux-64bit.deb
          sudo dpkg -i trivy_0.46.0_Linux-64bit.deb

      - name: Run Trivy FS scan
        run: trivy fs helm/

  kubeconform-schema:
    name: Kubernetes Schema Validation (Kubeconform)
    runs-on: ubuntu-latest
    needs: trivy-fs
    steps:
      - uses: actions/checkout@v3

      - name: Install Kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/

      - name: Run Kubeconform
        run: kubeconform -recursive helm/

  polaris-best-practices:
    name: Kubernetes Best Practices (Polaris)
    runs-on: ubuntu-latest
    needs: kubeconform-schema
    steps:
      - uses: actions/checkout@v3

      - name: Install Polaris
        run: |
          curl -sSL https://github.com/FairwindsOps/polaris/releases/latest/download/polaris_5.4.0_linux_amd64.tar.gz | tar xz
          sudo mv polaris /usr/local/bin/

      - name: Run Polaris
        run: polaris audit -f helm/

  checkov-iac:
    name: IaC Security (Checkov)
    runs-on: ubuntu-latest
    needs: polaris-best-practices
    steps:
      - uses: actions/checkout@v3

      - name: Install Checkov
        run: pip install checkov

      - name: Run Checkov
        run: checkov -d helm/ --framework kubernetes

  opa-conftest:
    name: Policy-as-Code (OPA / Conftest / Rego)
    runs-on: ubuntu-latest
    needs: checkov-iac
    steps:
      - uses: actions/checkout@v3

      - name: Install Conftest
        run: |
          wget https://github.com/open-policy-agent/conftest/releases/latest/download/conftest_1.11.0_Linux_x86_64.tar.gz
          tar xzf conftest_1.11.0_Linux_x86_64.tar.gz
          sudo mv conftest /usr/local/bin/

      - name: Run Conftest
        run: conftest test helm/

  syft-sbom:
    name: SBOM generation (Syft)
    runs-on: ubuntu-latest
    needs: opa-conftest
    steps:
      - uses: actions/checkout@v3

      - name: Install Syft
        run: curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh

      - name: Generate SBOM
        run: syft helm/ -o json > sbom.json

  grype-sbom-analysis:
    name: SBOM analysis (Grype)
    runs-on: ubuntu-latest
    needs: syft-sbom
    steps:
      - uses: actions/checkout@v3

      - name: Install Grype
        run: curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh

      - name: Analyze SBOM
        run: grype sbom:sbom.json

  scancode-licenses:
    name: Licenses Check (ScanCode Toolkit)
    runs-on: ubuntu-latest
    needs: grype-sbom-analysis
    steps:
      - uses: actions/checkout@v3

      - name: Install ScanCode
        run: pip install scancode-toolkit

      - name: Run ScanCode
        run: scancode --json scancode-result.json helm/