name: infra-ansible-ci

on:
  push:
    paths:
      - "infrastructure/ansible/**"
      - ".github/workflows/ci-infra-ansible-ci.yml"
  pull_request:
    paths:
      - "infrastructure/ansible/**"

permissions:
  contents: read
  id-token: write
  packages: write
  security-events: write

jobs:
  ansible-yamllint-lint:
    name: Code Quality (Yamllint + Ansible-Lint + Shellcheck)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: Install Ansible & linters
        run: |
          python -m pip install --upgrade pip
          pip install ansible ansible-lint yamllint
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Run Yamllint
        run: yamllint ansible/

      - name: Run Ansible-Lint
        run: ansible-lint ansible/

      - name: Run Shellcheck
        run: shellcheck **/*.sh

  gitleaks-secrets:
    name: Secrets Check (Gitleaks)
    runs-on: ubuntu-latest
    needs: ansible-yamllint-lint
    steps:
      - uses: actions/checkout@v3

      - name: Install Gitleaks
        run: |
          curl -sSfL https://raw.githubusercontent.com/zricethezav/gitleaks/main/install.sh | bash

      - name: Run Gitleaks
        run: gitleaks detect --source=ansible/ --verbose

  trivy-fs:
    name: Repo Security (Trivy FS)
    runs-on: ubuntu-latest
    needs: gitleaks-secrets
    steps:
      - uses: actions/checkout@v3

      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget
          wget https://github.com/aquasecurity/trivy/releases/latest/download/trivy_0.46.0_Linux-64bit.deb
          sudo dpkg -i trivy_0.46.0_Linux-64bit.deb

      - name: Run Trivy FS scan
        run: trivy fs ansible/

  semgrep-sast:
    name: SAST / Misconfiguration (Semgrep)
    runs-on: ubuntu-latest
    needs: trivy-fs
    steps:
      - uses: actions/checkout@v3

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep
        run: semgrep --config=auto ansible/

  checkov-iac:
    name: IaC Security (Checkov)
    runs-on: ubuntu-latest
    needs: semgrep-sast
    steps:
      - uses: actions/checkout@v3

      - name: Install Checkov
        run: pip install checkov

      - name: Run Checkov
        run: checkov -d ansible/ --framework ansible

  opa-conftest:
    name: Policy-as-Code (OPA / Conftest / Rego)
    runs-on: ubuntu-latest
    needs: checkov-iac
    steps:
      - uses: actions/checkout@v3

      - name: Install Conftest
        run: |
          wget https://github.com/open-policy-agent/conftest/releases/latest/download/conftest_1.11.0_Linux_x86_64.tar.gz
          tar xzf conftest_1.11.0_Linux_x86_64.tar.gz
          sudo mv conftest /usr/local/bin/

      - name: Run Conftest
        run: conftest test ansible/

  syft-sbom:
    name: SBOM generation (Syft)
    runs-on: ubuntu-latest
    needs: opa-conftest
    steps:
      - uses: actions/checkout@v3

      - name: Install Syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh

      - name: Generate SBOM
        run: syft ansible/ -o json > sbom.json

  grype-sbom-analysis:
    name: SBOM analysis (Grype)
    runs-on: ubuntu-latest
    needs: syft-sbom
    steps:
      - uses: actions/checkout@v3

      - name: Install Grype
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh

      - name: Analyze SBOM
        run: grype sbom:sbom.json

  scancode-licenses:
    name: Licenses Check (ScanCode Toolkit)
    runs-on: ubuntu-latest
    needs: grype-sbom-analysis
    steps:
      - uses: actions/checkout@v3

      - name: Install ScanCode
        run: pip install scancode-toolkit

      - name: Run ScanCode
        run: scancode --json scancode-result.json ansible/
