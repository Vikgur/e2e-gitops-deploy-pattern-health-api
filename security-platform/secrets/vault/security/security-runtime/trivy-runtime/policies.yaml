policies:
  - id: VAULT-001
    title: Vault container must not run as root
    severity: HIGH
    match:
      resource: container
      image: "hashicorp/vault:*"
    validate:
      runAsNonRoot: true

  - id: VAULT-002
    title: Vault container must have read-only root filesystem
    severity: MEDIUM
    match:
      resource: container
      image: "hashicorp/vault:*"
    validate:
      readOnlyRootFilesystem: true