- rule: Vault Sensitive File Access
  desc: Detect access to Vault data directory
  condition: >
    evt.type=open and
    fd.name startswith /vault/data and
    not proc.name in (vault)
  output: >
    Unexpected access to Vault data directory
    (user=%user.name command=%proc.cmdline file=%fd.name)
  priority: CRITICAL
  tags: [vault, security]

- rule: Vault Config Modification
  desc: Detect modification of Vault config
  condition: >
    evt.type in (open,openat,creat) and
    fd.name startswith /vault/config and
    not proc.name in (vault)
  output: >
    Vault configuration modified
    (user=%user.name command=%proc.cmdline file=%fd.name)
  priority: WARNING
  tags: [vault, security]

- rule: Vault Exec Inside Container
  desc: Detect shell execution inside Vault container
  condition: >
    container and
    proc.name in (bash,sh,zsh) and
    container.image.repository contains "vault"
  output: >
    Shell executed inside Vault container
    (user=%user.name command=%proc.cmdline)
  priority: WARNING
  tags: [vault, container]