apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-networkpolicy
spec:
  validationFailureAction: enforce
  background: true
  rules:
    - name: check-networkpolicy
      match:
        any:
          - resources:
              kinds:
                - Namespace
      validate:
        message: "Each namespace must have a NetworkPolicy"
        deny:
          conditions:
            any:
              - key: "{{ request.object.metadata.name }}"
                operator: NotEquals
                value: "kube-system"