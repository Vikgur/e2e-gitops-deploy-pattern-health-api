apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: frontend-secrets
  namespace: frontend
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: SecretStore

  target:
    name: frontend-secrets
    creationPolicy: Owner

  data:
    - secretKey: API_TOKEN
      remoteRef:
        key: secret/data/apps/api-keys
        property: internal_service_token