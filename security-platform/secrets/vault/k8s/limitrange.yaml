apiVersion: v1
kind: LimitRange
metadata:
  name: vault-limits
  namespace: vault
spec:
  limits:
  - type: Container
    min:
      cpu: 100m
      memory: 128Mi
    max:
      cpu: "2"
      memory: 2Gi
    defaultRequest:
      cpu: 250m
      memory: 256Mi
    default:
      cpu: "1"
      memory: 1Gi